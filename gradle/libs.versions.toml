[versions]
# Build
kotlin = "2.4.21"
ktlint = "1.8.0"
springBoot = "4.1.2"
springAi = "2.0.2"
spotless = "8.11.0"

# Libraries not managed by the Spring BOMs
telegram-bots = "10.3.0"
otel-logback = "2.33.1-alpha"
datasource-micrometer = "2.3.0"
htmx = "6.0.1"
ngrok = "0.11.0"
mockito-kotlin = "6.4.0"

[libraries]
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-model = { module = "org.springframework.ai:spring-ai-model" }
spring-ai-ollama-starter = { module = "org.springframework.ai:spring-ai-starter-model-ollama" }
spring-ai-openai-starter = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
telegrambots-longpolling = { group = "org.telegram", name = "telegrambots-longpolling", version.ref = "telegram-bots" }
telegrambots-client = { group = "org.telegram", name = "telegrambots-client", version.ref = "telegram-bots" }
otel-logback-appender = { group = "io.opentelemetry.instrumentation", name = "opentelemetry-logback-appender-1.0", version.ref = "otel-logback" }
micrometer-datasource = { group = "net.ttddyy.observation", name = "datasource-micrometer-spring-boot", version.ref = "datasource-micrometer" }
htmx-spring-boot-thymeleaf = { group = "io.github.wimdeblauwe", name = "htmx-spring-boot-thymeleaf", version.ref = "htmx" }
ngrok-spring-boot = { group = "io.github.kilmajster", name = "ngrok-spring-boot-starter", version.ref = "ngrok" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-observation = { module = "io.micrometer:micrometer-observation" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[bundles]
telegram = ["telegrambots-longpolling", "telegrambots-client"]
observability = ["micrometer-core", "micrometer-observation"]
observabilityStack = ["otel-logback-appender", "micrometer-datasource"]
