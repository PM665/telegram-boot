<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
</head>
<body>
<h1>Admin login</h1>
<p>Sign in with Telegram.</p>
<p th:if="${!telegramLoginWidgetEnabled}" style="color:#b00020;">
    Telegram widget not configured. Set <code>telegram-boot.admin.telegram-login-bot-username</code>.
</p>
<p>
    Mini app login endpoint: <code>/mini-app</code>. Set allowed origins in
    <code>telegram-boot.admin.mini-app-url</code>.
</p>
<script th:if="${telegramLoginWidgetEnabled}"
        async src="https://telegram.org/js/telegram-widget.js?22"
        th:attr="data-telegram-login=${telegramLoginBotUsername},data-auth-url=@{/login/telegram}"
        data-size="large"
        data-userpic="false"
        data-request-access="write"></script>
</body>
</html>
